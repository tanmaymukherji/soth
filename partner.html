<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner - SoTH</title>
<link rel="stylesheet" href="styles/app.css?v=20260731a">
<script src="config.js?v=20260731a"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  onload="window.dispatchEvent(new Event('supabaseReady'))"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="data/lgd.js?v=20260731a"></script>
<script src="app/core.js?v=20260731a"></script>
<script src="app/map.js?v=20260731a"></script>
<script src="app/maturity.js?v=20260731a"></script>
<script src="app/capture.js?v=20260731a"></script>
<style>
.partner-hero { display:flex; align-items:center; justify-content:space-between; padding:20px 0; border-bottom:1px solid var(--gray-200); margin-bottom:16px; }
.partner-hero h1 { margin:0; font-size:24px; }
.partner-hero .back-link { font-size:13px; color:var(--gray-500); text-decoration:none; }
.partner-hero .back-link:hover { color:var(--primary); }
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.stats-row .stat-card { padding:14px; }
.filter-row { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.filter-row select { min-width:180px; }
.edit-village-btn { display:inline-block; margin-left:12px; }
.radar-section { margin-bottom:20px; text-align:center; }
.params-body { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
@media (max-width:900px) { .params-body { grid-template-columns:1fr; } }
.section-title { font-weight:600; margin-bottom:8px; font-size:14px; }
.empty-hint { color:var(--gray-400); font-size:13px; font-style:italic; padding:20px 0; text-align:center; }
.theme-table { width:100%; border-collapse:collapse; font-size:13px; }
.theme-table th,.theme-table td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--gray-200); }
.theme-table th { background:var(--gray-50); font-weight:600; color:var(--gray-600); font-size:12px; text-transform:uppercase; letter-spacing:0.05em; }
.theme-table tbody tr { cursor:pointer; transition:background 0.15s; }
.theme-table tbody tr:hover { background:var(--gray-50); }
.theme-table tbody tr.active-theme { background:var(--primary-light); }
.subparam-table { width:100%; border-collapse:collapse; font-size:13px; }
.subparam-table th,.subparam-table td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--gray-200); }
.subparam-table th { background:var(--gray-50); font-weight:600; color:var(--gray-600); font-size:11px; text-transform:uppercase; }
.expand-icon { font-size:12px; color:var(--gray-500); display:inline-block; transition:transform 0.2s; }
.scope-label { font-size:12px; color:var(--gray-500); margin-bottom:4px; }
</style>
</head>
<body>
<div id="toast-container"></div>

<header class="app-header">
  <div class="brand">Sense of <span>The House</span></div>
  <nav>
    <a href="index.html">Map</a>
    <a href="dashboard.html" id="nav-dashboard" style="display:none">Dashboard</a>
    <a href="superset.html">Superset</a>
    <a href="compare.html" id="nav-compare" style="display:none">Compare</a>
    <a href="admin.html" id="nav-admin" style="display:none">Admin</a>
    <span id="user-label" style="display:none;font-size:12px;color:var(--gray-500);"></span>
    <a href="login.html" id="nav-login">Login</a>
    <button id="nav-logout" style="display:none" onclick="soth.auth.signOut(); window.location='index.html'">Logout</button>
  </nav>
</header>

<main class="app-content">
  <div id="partner-page">
    <div class="loading-spinner">Loading partner data...</div>
  </div>
</main>

<script>
soth._partnerChart = null;

// Map a capture to a numeric score (handles both quantitative and qualitative)
soth._capScore = function (cap) {
  if (!cap) return null;
  if (cap.value_scale != null) return cap.value_scale;
  const t = (cap.value_text || '').trim().toLowerCase();
  if (t === 'yes') return 100;
  if (t === 'partially') return 50;
  if (t === 'no') return 0;
  return null;
};

soth.renderPartnerPage = async function (orgId, orgName) {
  const container = document.getElementById('partner-page');

  // Fetch all data
  const [orgVillages, themes, allSubParams] = await Promise.all([
    soth.data.orgVillages(orgId),
    soth.data.themes(),
    soth.data.allSubParams(),
  ]);

  const allVillages = orgVillages.map(ov => ov.villages).filter(Boolean);
  const statesSet = new Set(allVillages.map(v => v.state).filter(Boolean));
  const uniqueStates = [...statesSet].sort();
  const allVillagesSorted = [...allVillages].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  // All captures for this org
  const capsRes = await soth.sb().from('latest_captures').select('*').eq('org_id', orgId);
  const capByVillage = {};
  (capsRes?.data || []).forEach(c => {
    if (!capByVillage[c.village_id]) capByVillage[c.village_id] = {};
    capByVillage[c.village_id][c.sub_parameter_id] = c;
  });

  // Params by theme
  const paramsByTheme = {};
  allSubParams.forEach(p => {
    if (!paramsByTheme[p.theme_id]) paramsByTheme[p.theme_id] = [];
    paramsByTheme[p.theme_id].push(p);
  });

  // Store globally for filter callbacks
  soth._pOrgId = orgId;
  soth._pOrgName = orgName;
  soth._pThemes = themes;
  soth._pParamsByTheme = paramsByTheme;
  soth._pCapByVillage = capByVillage;
  soth._pAllVillages = allVillages;
  soth._pUniqueStates = uniqueStates;

  // Build static HTML shell
  let html = '';

  // Hero
  html += `<div class="partner-hero">
    <div>
      <a href="index.html" class="back-link">&larr; Back to Map</a>
      <h1>${soth.ui.escapeHtml(orgName)}</h1>
    </div>
    <div id="hero-score" style="text-align:right;"></div>
  </div>`;

  // Stats
  html += `<div class="stats-row" id="stats-row"></div>`;

  // Filters
  html += `<div class="filter-row">
    <select id="v-state-filter" onchange="soth.onFilterChange()">
      <option value="">All States</option>
      ${uniqueStates.map(s => `<option value="${soth.ui.escapeHtml(s)}">${soth.ui.escapeHtml(s)}</option>`).join('')}
    </select>
    <select id="v-village-filter" onchange="soth.onFilterChange()">
      <option value="">All Villages (${allVillagesSorted.length})</option>
      ${allVillagesSorted.map(v => `<option value="${v.id}">${soth.ui.escapeHtml(v.name)} — ${soth.ui.escapeHtml(v.district || '')}</option>`).join('')}
    </select>
    <span id="edit-village-btn"></span>
  </div>`;

  // Scope label
  html += `<div class="scope-label" id="scope-label">Showing: All villages</div>`;

  // Radar
  html += `<div class="radar-section">
    <div style="height:300px;max-width:500px;margin:0 auto;"><canvas id="partner-radar"></canvas></div>
  </div>`;

  // Params + Sub-params
  html += `<div class="params-body">
    <div>
      <div class="section-title">Parameters</div>
      <div id="theme-table-container"></div>
    </div>
    <div>
      <div class="section-title">Sub-Parameters</div>
      <div id="subparam-container"><p class="empty-hint">Click a theme on the left to view its sub-parameters</p></div>
    </div>
  </div>`;

  // Village editor (shown when a village is selected)
  html += `<div id="village-editor" class="hidden" style="margin-top:20px;border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;background:var(--gray-50);">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div class="section-title" style="margin:0;" id="editor-title">Edit Village</div>
      <a id="editor-village-link" href="#" class="btn btn-small btn-outline" target="_blank">Open Full Editor</a>
    </div>
    <div id="editor-content"></div>
  </div>`;

  container.innerHTML = html;

  // Initial render
  soth.updatePartnerView();
};

soth.updatePartnerView = function () {
  const state = document.getElementById('v-state-filter')?.value || '';
  const villageId = document.getElementById('v-village-filter')?.value || '';
  const themes = soth._pThemes || [];
  const paramsByTheme = soth._pParamsByTheme || {};
  const capByVillage = soth._pCapByVillage || {};
  const allVillages = soth._pAllVillages || [];
  const orgId = soth._pOrgId;

  // Determine scope
  let scopeVillages = allVillages;
  let scopeLabel = 'Showing: All villages';
  if (villageId) {
    const v = allVillages.find(x => x.id === villageId);
    scopeVillages = v ? [v] : [];
    scopeLabel = 'Showing: ' + (v?.name || 'Village');
  } else if (state) {
    scopeVillages = allVillages.filter(v => v.state === state);
    scopeLabel = 'Showing: ' + state + ' (' + scopeVillages.length + ' villages)';
  }

  const scopeVillageIds = new Set(scopeVillages.map(v => v.id));
  const withData = scopeVillages.filter(v => capByVillage[v.id]).length;
  const withoutData = scopeVillages.length - withData;
  const uniqueStatesInScope = new Set(scopeVillages.map(v => v.state).filter(Boolean)).size;

  // Update scope label
  const scopeEl = document.getElementById('scope-label');
  if (scopeEl) scopeEl.textContent = scopeLabel;

  // Update hero score
  const heroEl = document.getElementById('hero-score');
  if (heroEl) {
    const overallScore = soth.computeScopeScore(scopeVillages, themes, paramsByTheme, capByVillage);
    const color = soth.map.maturityColor(overallScore);
    heroEl.innerHTML = `<div style="font-size:36px;font-weight:700;color:${color};">${overallScore}%</div>
      <div style="font-size:12px;color:var(--gray-500);">${villageId ? 'Village' : state ? 'State' : 'Overall'} Maturity</div>`;
  }

  // Update stats
  const statsEl = document.getElementById('stats-row');
  if (statsEl) {
    statsEl.innerHTML = `
      <div class="stat-card"><div class="stat-value">${scopeVillages.length}</div><div class="stat-label">Villages</div></div>
      <div class="stat-card"><div class="stat-value">${uniqueStatesInScope}</div><div class="stat-label">States</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--success);">${withData}</div><div class="stat-label">With Data</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--danger);">${withoutData}</div><div class="stat-label">Without Data</div></div>`;
  }

  // Update Edit button
  const editBtn = document.getElementById('edit-village-btn');
  if (editBtn) {
    if (villageId) {
      editBtn.innerHTML = `<a href="village.html?org=${orgId}&village=${villageId}" class="btn btn-primary btn-small">Edit Village Data</a>`;
    } else {
      editBtn.innerHTML = '';
    }
  }

  // Compute per-theme scores for scope
  const themeScores = themes.map(t => {
    const params = paramsByTheme[t.id] || [];
    let sum = 0, counted = 0, capturedParams = 0;
    const themeCaptures = [];
    params.forEach(p => {
      let villageHasCaptured = false;
      for (const vid of scopeVillageIds) {
        const cap = capByVillage[vid]?.[p.id];
        if (cap) {
          villageHasCaptured = true;
          capturedParams++;
          const s = soth._capScore(cap);
          if (s != null) { sum += s; counted++; }
          break;
        }
      }
      if (villageHasCaptured) themeCaptures.push(p);
    });
    const score = counted ? Math.round(sum / counted) : 0;
    return { id: t.id, name: t.name, score, capturedParams, totalParams: params.length };
  });

  // Update radar chart
  const canvas = document.getElementById('partner-radar');
  if (canvas) {
    if (soth._partnerChart) soth._partnerChart.destroy();
    soth._partnerChart = new Chart(canvas, {
      type: 'radar',
      data: {
        labels: themeScores.map(t => t.name),
        datasets: [{
          label: 'Score',
          data: themeScores.map(t => t.score),
          backgroundColor: 'rgba(37,99,235,0.1)',
          borderColor: '#2563eb',
          pointBackgroundColor: themeScores.map(t => soth.map.maturityColor(t.score)),
          pointRadius: 5,
          borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { r: { min: 0, max: 100, ticks: { stepSize: 20 } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  // Update theme table
  const tableEl = document.getElementById('theme-table-container');
  if (tableEl) {
    let thtml = '<table class="theme-table" id="theme-table"><thead><tr><th>Theme</th><th>Score</th><th>Captured</th><th></th></tr></thead><tbody>';
    themeScores.forEach(t => {
      const color = soth.map.maturityColor(t.score);
      thtml += `<tr data-theme-id="${t.id}" onclick="soth.toggleTheme('${t.id}')">
        <td><strong>${soth.ui.escapeHtml(t.name)}</strong></td>
        <td><span style="background:${color};color:white;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;">${t.score}%</span></td>
        <td>${t.capturedParams}/${t.totalParams}</td>
        <td><span class="expand-icon">▸</span></td>
      </tr>`;
    });
    thtml += '</tbody></table>';
    tableEl.innerHTML = thtml;
  }

  // Clear sub-param panel
  const subEl = document.getElementById('subparam-container');
  if (subEl) subEl.innerHTML = '<p class="empty-hint">Click a theme on the left to view its sub-parameters</p>';

  // Show/hide village editor
  const editorEl = document.getElementById('village-editor');
  const editorTitle = document.getElementById('editor-title');
  const editorLink = document.getElementById('editor-village-link');
  const editorContent = document.getElementById('editor-content');
  if (editorEl) {
    if (villageId) {
      const v = allVillages.find(x => x.id === villageId);
      editorEl.classList.remove('hidden');
      if (editorTitle) editorTitle.textContent = 'Edit: ' + (v?.name || 'Village');
      if (editorLink) editorLink.href = 'village.html?org=' + orgId + '&village=' + villageId;
      // Build editor rows for all sub-params
      let ehtml = '<table class="subparam-table"><thead><tr><th>Sub-Parameter</th><th>Qualitative</th><th>Quantitative (0-100)</th><th></th></tr></thead><tbody>';
      themes.forEach(t => {
        const params = paramsByTheme[t.id] || [];
        params.forEach(p => {
          const cap = capByVillage[villageId]?.[p.id];
          const qualVal = cap?.value_text || '';
          const quantVal = cap?.value_scale != null ? cap.value_scale : '';
          const opts = { 'yes': 'Yes', 'no': 'No', 'partially': 'Partially', 'na': 'N/A', 'not_tracking': 'Not Tracking' };
          const matchedKey = Object.keys(opts).find(k => k.toLowerCase() === qualVal.toLowerCase()) || '';
          let dd = `<select id="eq-${p.id}" class="capture-input" style="width:100%;padding:4px 8px;font-size:12px;">
            <option value="">--</option>`;
          for (const [k, v] of Object.entries(opts)) {
            dd += `<option value="${k}"${matchedKey === k ? ' selected' : ''}>${v}</option>`;
          }
          dd += '</select>';
          const numInput = `<input type="number" id="en-${p.id}" min="0" max="100" step="1" value="${quantVal}" placeholder="0-100" class="capture-input" style="width:80px;padding:4px 8px;font-size:12px;">`;
          ehtml += `<tr>
            <td style="font-size:12px;"><strong>${soth.ui.escapeHtml(p.name)}</strong><br><span style="color:var(--gray-400);font-size:11px;">${soth.ui.escapeHtml(t.name)}</span></td>
            <td>${dd}</td>
            <td>${numInput}</td>
            <td><button class="btn btn-small" onclick="soth.savePartnerCapture('${p.id}')">Save</button></td>
          </tr>`;
        });
      });
      ehtml += '</tbody></table>';
      editorContent.innerHTML = ehtml;
    } else {
      editorEl.classList.add('hidden');
    }
  }
};

soth.computeScopeScore = function (scopeVillages, themes, paramsByTheme, capByVillage) {
  const scopeIds = new Set(scopeVillages.map(v => v.id));
  let totalScore = 0, scoredThemes = 0;
  themes.forEach(t => {
    const params = paramsByTheme[t.id] || [];
    let sum = 0, counted = 0;
    params.forEach(p => {
      for (const vid of scopeIds) {
        const cap = capByVillage[vid]?.[p.id];
        const s = soth._capScore(cap);
        if (s != null) { sum += s; counted++; break; }
      }
    });
    if (counted) { totalScore += Math.round(sum / counted); scoredThemes++; }
  });
  return scoredThemes ? Math.round(totalScore / scoredThemes) : 0;
};

soth.toggleTheme = function (themeId) {
  const row = document.querySelector('#theme-table tr[data-theme-id="' + themeId + '"]');
  const icon = row?.querySelector('.expand-icon');
  const container = document.getElementById('subparam-container');
  if (!container) return;

  const wasActive = row?.classList.contains('active-theme');
  document.querySelectorAll('#theme-table tbody tr').forEach(r => r.classList.remove('active-theme'));
  document.querySelectorAll('#theme-table .expand-icon').forEach(i => i.textContent = '▸');

  if (wasActive) {
    container.innerHTML = '<p class="empty-hint">Click a theme on the left to view its sub-parameters</p>';
    return;
  }

  row?.classList.add('active-theme');
  if (icon) icon.textContent = '▾';

  // Build sub-param table for current scope
  const state = document.getElementById('v-state-filter')?.value || '';
  const villageId = document.getElementById('v-village-filter')?.value || '';
  const allVillages = soth._pAllVillages || [];
  const capByVillage = soth._pCapByVillage || {};
  const paramsByTheme = soth._pParamsByTheme || {};

  let scopeVillages = allVillages;
  if (villageId) scopeVillages = allVillages.filter(v => v.id === villageId);
  else if (state) scopeVillages = allVillages.filter(v => v.state === state);
  const scopeIds = new Set(scopeVillages.map(v => v.id));

  const params = paramsByTheme[themeId] || [];
  let html = '<table class="subparam-table"><thead><tr><th>Sub-Parameter</th><th>Type</th><th>Qualitative</th><th>Score</th><th>Coverage</th></tr></thead><tbody>';
  params.forEach(p => {
    let capturedCount = 0, qualVal = '', scoreVal = null;
    for (const vid of scopeIds) {
      const cap = capByVillage[vid]?.[p.id];
      if (cap) {
        capturedCount++;
        if (!qualVal && cap.value_text) qualVal = cap.value_text;
        const s = soth._capScore(cap);
        if (scoreVal == null && s != null) scoreVal = s;
      }
    }
    html += `<tr>
      <td><strong>${soth.ui.escapeHtml(p.name)}</strong></td>
      <td>${soth.ui.dataTypeLabel(p.data_type)}</td>
      <td>${qualVal || '—'}</td>
      <td>${scoreVal != null ? scoreVal + '%' : '—'}</td>
      <td>${capturedCount}/${scopeVillages.length}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  if (!params.length) html = '<p class="empty-hint">No sub-parameters defined for this theme</p>';
  container.innerHTML = html;
};

soth.onFilterChange = function () {
  const state = document.getElementById('v-state-filter')?.value || '';
  const villageSelect = document.getElementById('v-village-filter');
  const allVillages = soth._pAllVillages || [];
  const currentVillage = villageSelect?.value || '';

  // Rebuild village dropdown filtered by state
  const filtered = state ? allVillages.filter(v => v.state === state) : allVillages;
  const sorted = [...filtered].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  villageSelect.innerHTML = `<option value="">All Villages (${sorted.length})</option>` +
    sorted.map(v => `<option value="${v.id}"${v.id === currentVillage ? ' selected' : ''}>${soth.ui.escapeHtml(v.name)} — ${soth.ui.escapeHtml(v.district || '')}</option>`).join('');

  // Re-render everything
  soth.updatePartnerView();
};

soth.savePartnerCapture = async function (subParamId) {
  const villageId = document.getElementById('v-village-filter')?.value;
  if (!villageId) return;
  const orgId = soth._pOrgId;
  const dd = document.getElementById('eq-' + subParamId);
  const num = document.getElementById('en-' + subParamId);
  const textVal = dd ? dd.value : '';
  const rawPct = num ? num.value.trim() : '';
  const pctVal = rawPct !== '' ? parseInt(rawPct, 10) : null;
  if (!textVal && pctVal == null) return;

  const payload = {
    org_id: orgId,
    village_id: villageId,
    sub_parameter_id: subParamId,
    data_type: pctVal != null ? 'quantitative_scale' : 'qualitative',
    value_text: textVal || '',
    value_scale: pctVal,
    value_numeric: null,
  };
  const { data, error } = await soth.data.saveCapture(payload);
  if (error) { soth.ui.showToast('Error: ' + error.message, 'error'); return; }
  // Update local cache
  if (!soth._pCapByVillage[villageId]) soth._pCapByVillage[villageId] = {};
  soth._pCapByVillage[villageId][subParamId] = data;
  soth.ui.showToast('Saved!', 'success');
  // Refresh the view to update scores
  soth.updatePartnerView();
};

(async function () {
  await soth.auth.init();

  if (soth.currentUser) {
    document.getElementById('nav-dashboard').style.display = '';
    document.getElementById('nav-login').style.display = 'none';
    document.getElementById('nav-logout').style.display = '';
    document.getElementById('user-label').textContent = soth.currentUser.email;
    document.getElementById('user-label').style.display = '';
    if (soth.currentProfile?.role === 'soth_admin') {
      document.getElementById('nav-admin').style.display = '';
    }
  }

  if (!soth.auth.requireAuth('login.html')) return;

  const params = new URLSearchParams(window.location.search);
  const orgId = params.get('org');
  if (!orgId) {
    document.getElementById('partner-page').innerHTML = '<p class="empty-state">No partner specified. <a href="index.html">Go to Map</a></p>';
    return;
  }

  try {
    const sb = soth.sb();
    const { data: org } = await sb.from('organizations').select('*').eq('id', orgId).single();
    if (!org) {
      document.getElementById('partner-page').innerHTML = '<p class="empty-state">Partner not found.</p>';
      return;
    }

    if (soth.currentProfile.role !== 'soth_admin' && soth.currentProfile.org_id !== orgId) {
      document.getElementById('partner-page').innerHTML = '<p class="empty-state">You do not have access to this partner.</p>';
      return;
    }

    await soth.renderPartnerPage(orgId, org.name);
  } catch (e) {
    console.error('Partner page error:', e);
    document.getElementById('partner-page').innerHTML = '<p class="empty-state">Failed to load partner data.</p>';
  }
})();
</script>
</body>
</html>
