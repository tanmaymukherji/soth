<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sense of The House (SoTH)</title>
<link rel="stylesheet" href="styles/app.css?v=20260730c">
<script src="config.js?v=20260730c"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  onload="window.dispatchEvent(new Event('supabaseReady'))"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="data/lgd.js?v=20260730c"></script>
<script src="app/core.js?v=20260730c"></script>
<script src="app/map.js?v=20260730c"></script>
<script src="app/maturity.js?v=20260730c"></script>
<script src="app/capture.js?v=20260730c"></script>
<script src="app/superset.js?v=20260730c"></script>
</head>
<body>
<div id="toast-container"></div>

<header class="app-header">
  <div class="brand">Sense of <span>The House</span></div>
    <nav>
    <a href="index.html">Map</a>
    <a href="dashboard.html" id="nav-dashboard" style="display:none">Dashboard</a>
    <a href="superset.html">Superset</a>
    <a href="compare.html" id="nav-compare" style="display:none">Compare</a>
    <a href="admin.html" id="nav-admin" style="display:none">Admin</a>
    <span id="user-label" style="display:none;font-size:12px;color:var(--gray-500);"></span>
    <a href="login.html" id="nav-login">Login</a>
    <button id="nav-logout" style="display:none" onclick="soth.auth.signOut(); window.location='index.html'">Logout</button>
  </nav>
</header>

<main class="app-content">
  <div class="card" style="margin-bottom:20px;">
    <div class="card-header">
      <span>India - Partner & Parameter Coverage Map</span>
      <span style="display:flex;gap:8px;font-size:12px;font-weight:400;">
        <select id="map-theme-filter" onchange="soth.renderMap()">
          <option value="">All Themes</option>
        </select>
        <select id="map-org-filter" onchange="soth.renderMap()">
          <option value="">All Partners</option>
        </select>
        <select id="map-state-filter" onchange="soth.renderMap()">
          <option value="">All States</option>
        </select>
      </span>
    </div>
    <div id="map" class="map-container" style="height:600px;"></div>
  </div>

  <div class="dashboard-grid" id="stats-ribbon"></div>

  <div class="card" style="margin-top:20px;display:none;" id="maturity-card">
    <div class="card-header">
      <span>Partner Maturity Overview</span>
      <span id="maturity-count" style="font-size:13px;font-weight:400;color:var(--gray-500);"></span>
    </div>
    <div id="maturity-charts" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;"></div>
  </div>
</main>

<!-- Village Detail Side Panel -->
<aside id="village-detail-panel" class="village-detail-panel hidden" role="dialog" aria-modal="true" aria-label="Village details">
  <div class="panel-header">
    <h3 id="panel-village-name">Village</h3>
    <button class="btn btn-outline btn-small" onclick="soth.closeVillagePanel()" aria-label="Close">✕</button>
  </div>
  <div id="panel-content" class="panel-content"></div>
</aside>

<!-- History Modal -->
<div id="history-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <div id="history-body"></div>
    <div class="form-actions"><button class="btn btn-outline" onclick="document.getElementById('history-modal').classList.add('hidden')">Close</button></div>
  </div>
</div>

<!-- Propose Modal -->
<div id="propose-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>Propose New Sub-Parameter for <span id="propose-theme-name"></span></h3>
    <form id="propose-form">
      <input type="hidden" id="propose-theme-id">
      <label>Parameter Name *<input type="text" id="propose-name" required></label>
      <label>Description<textarea id="propose-desc" rows="2"></textarea></label>
      <label>Data Type<select id="propose-data-type">
        <option value="qualitative">Qualitative (Yes/No/Partial)</option>
        <option value="quantitative_scale">Quantitative (Scale)</option>
        <option value="quantitative_numeric">Quantitative (Number)</option>
        <option value="text">Text / Notes</option>
      </select></label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Submit for Review</button>
        <button type="button" class="btn btn-outline" onclick="document.getElementById('propose-modal').classList.add('hidden')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
soth.renderMap = async function () {
  const themeFilter = document.getElementById('map-theme-filter')?.value || '';
  const orgFilter = document.getElementById('map-org-filter')?.value || '';
  const stateFilter = document.getElementById('map-state-filter')?.value || '';

  const map = await soth.map.createMap('map');
  if (!map) return;

  soth.map.clearMarkers();

  // Wait for boundary polygons to load BEFORE adding markers (pins render on top)
  if (soth.map._boundariesPromise) await soth.map._boundariesPromise;

  // Load all orgs + pre-compute their maturities in parallel
  // Only count partner orgs in stats (observers are excluded)
  const allOrgs = await soth.data.organizations();
  const partnerOrgs = allOrgs.filter(o => o.org_type !== 'observer');
  const orgs = partnerOrgs;
  const filteredOrgs = orgFilter ? orgs.filter(o => o.id === orgFilter) : orgs;
  const maturities = await Promise.all(filteredOrgs.map(o => soth.maturity.compute(o.id)));
  const maturityByOrg = {};
  filteredOrgs.forEach((o, i) => { maturityByOrg[o.id] = maturities[i]; });

  // Build per-coordinate cluster: key = "lat,lng" -> { villages:[], orgs:[] }
  const coordMap = {};
  for (const org of filteredOrgs) {
    const villages = await soth.data.orgVillages(org.id);
    const maturity = maturityByOrg[org.id];
    for (const ov of villages) {
      const v = ov.villages;
      if (!v || !v.lat || !v.lng) continue;
      if (stateFilter && v.state !== stateFilter) continue;
      if (themeFilter) {
        const caps = await soth.data.latestCaptures(org.id, v.id);
        const hasTheme = caps.some(c => c.sub_parameters?.theme_id === themeFilter);
        if (!hasTheme) continue;
      }
      const key = `${v.lat},${v.lng}`;
      if (!coordMap[key]) {
        coordMap[key] = { lat: v.lat, lng: v.lng, villages: [], orgsSet: {} };
      }
      const cluster = coordMap[key];
      // Deduplicate villages by id (same village can appear under multiple orgs)
      if (!cluster.villages.find(x => x.id === v.id)) {
        cluster.villages.push({ id: v.id, name: v.name, district: v.district, state: v.state });
      }
      // Deduplicate orgs by id
      if (!cluster.orgsSet[org.id]) {
        cluster.orgsSet[org.id] = {
          id: org.id, name: org.name,
          maturity: Math.round(maturity.overall),
          color: maturity.overall ? soth.map.maturityColor(maturity.overall) : '#94a3b8',
        };
      }
    }
  }

  // Render one pin per unique coordinate
  for (const key in coordMap) {
    const cluster = coordMap[key];
    const orgsList = Object.values(cluster.orgsSet);
    const bestOrg = orgsList.sort((a, b) => b.maturity - a.maturity)[0];
    soth.map.addVillagePin({
      lat: cluster.lat,
      lng: cluster.lng,
      villages: cluster.villages,
      allOrgs: orgsList,
      color: bestOrg?.color || '#94a3b8',
      maturity: bestOrg?.maturity || 0,
    });
  }
};

soth.renderStats = async function () {
  const allOrgs = await soth.data.organizations();
  const partnerOrgs = allOrgs.filter(o => o.org_type !== 'observer');
  const allParams = await soth.data.allSubParams();
  const { data: allVillages } = await soth.sb().from('villages').select('*').limit(1);
  const { count: vCount } = await soth.sb().from('villages').select('*', { count: 'exact', head: true });

  const ribbon = document.getElementById('stats-ribbon');
  ribbon.innerHTML = `
    <div class="stat-card"><div class="stat-value">${partnerOrgs.length}</div><div class="stat-label">Partner Organisations</div></div>
    <div class="stat-card"><div class="stat-value">${allParams.length}</div><div class="stat-label">Sub-Parameters (Superset)</div></div>
      <div class="stat-card"><div class="stat-value">${vCount || 0}</div><div class="stat-label">Villages</div></div>
    <div class="stat-card"><div class="stat-value">${new Set(allParams.map(p => p.theme_id)).size}</div><div class="stat-label">Thematic Areas</div></div>
  `;
};

soth.renderMaturityCharts = async function () {
  const card = document.getElementById('maturity-card');
  const user = soth.currentUser;
  const profile = soth.currentProfile;
  if (!user || !profile) { card.style.display = 'none'; return; }
  card.style.display = '';

  try {
    const orgs = await soth.data.organizations();
    const container = document.getElementById('maturity-charts');
    const countLabel = document.getElementById('maturity-count');

    // Admin sees all partner orgs, partner sees only their org
    const partnerOrgs = orgs.filter(o => o.org_type !== 'observer');
    const orgsToShow = profile.role === 'soth_admin'
      ? partnerOrgs
      : partnerOrgs.filter(o => o.id === profile.org_id);

    let totalScores = 0;
    let scored = 0;
    const cards = [];
    // Pre-fetch village counts for all orgs in parallel
    const orgVillageCounts = {};
    await Promise.all(orgsToShow.map(async (org) => {
      const villages = await soth.data.orgVillages(org.id);
      orgVillageCounts[org.id] = villages.length;
    }));
    for (const org of orgsToShow) {
      const m = await soth.maturity.compute(org.id);
      totalScores += m.overall || 0;
      if (m.overall) scored++;
      const color = soth.map.maturityColor(m.overall);
      const vCount = orgVillageCounts[org.id] || 0;
      cards.push(`<div class="card" style="padding:16px;cursor:pointer;transition:box-shadow 0.15s;" onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,0.1)'" onmouseout="this.style.boxShadow='none'" onclick="window.location.href='partner.html?org=${org.id}'">
        <div style="font-weight:600;font-size:14px;margin-bottom:4px;">${soth.ui.escapeHtml(org.name)}</div>
        <div style="font-size:11px;color:var(--gray-400);margin-bottom:8px;">${vCount} village${vCount !== 1 ? 's' : ''}</div>
        <div style="font-size:28px;font-weight:700;color:${color};">${m.overall}%</div>
        <div class="maturity-bar"><div class="maturity-fill" style="width:${m.overall}%;background:${color};"></div></div>
        <div style="font-size:12px;color:var(--gray-500);margin-top:8px;">
          ${m.overall ? m.themes.filter(t => t.score > 0).length + '/' + m.themes.length + ' themes active' : 'No capture data yet'}
        </div>
      </div>`);
    }
    container.innerHTML = cards.join('');
    countLabel.textContent = scored ? `Average: ${orgsToShow.length ? Math.round(totalScores / orgsToShow.length) : 0}%` : 'No capture data yet';
  } catch (e) {
    console.error('SoTH: renderMaturityCharts error:', e);
  }
};

// Village Detail Panel
soth.openVillageInPanel = async function (orgId, villageId, villageName) {
  const panel = document.getElementById('village-detail-panel');
  const content = document.getElementById('panel-content');
  const title = document.getElementById('panel-village-name');
  if (!panel || !content || !title) return;

  title.textContent = villageName;
  content.innerHTML = '<div class="loading-spinner">Loading village data...</div>';
  panel.classList.remove('hidden');

  // Require login; RLS will protect unauthorized writes
  if (!soth.currentUser || !soth.currentProfile) {
    content.innerHTML = '<p class="empty-state">Please <a href="login.html">log in</a> to view and edit village details.</p>';
    return;
  }

  try {
    // Non-admins can only open their own org's villages
    if (soth.currentProfile.role !== 'soth_admin' && soth.currentProfile.org_id !== orgId) {
      content.innerHTML = '<p class="empty-state">You do not have access to this village.</p>';
      return;
    }
    await soth.capture.renderTieredWorkspace('panel-content', { orgId, villageId });
  } catch (e) {
    console.error('openVillageInPanel error:', e);
    content.innerHTML = '<p class="empty-state">Failed to load village data.</p>';
  }
};

soth.closeVillagePanel = function () {
  const panel = document.getElementById('village-detail-panel');
  if (panel) panel.classList.add('hidden');
};

// Wire propose form
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('propose-form')?.addEventListener('submit', function (e) {
    e.preventDefault();
    soth.capture.submitProposal();
  });
});

// Populate filters
(async function initPage() {
  try {
    await soth.auth.init();

  if (soth.currentUser) {
    document.getElementById('nav-dashboard').style.display = '';
    document.getElementById('nav-login').style.display = 'none';
    document.getElementById('nav-logout').style.display = '';
    document.getElementById('user-label').textContent = soth.currentUser.email;
    document.getElementById('user-label').style.display = '';
    if (soth.currentProfile?.role === 'soth_admin') {
      document.getElementById('nav-admin').style.display = '';
    }
  }

    const themes = await soth.data.themes();
    const themeSelect = document.getElementById('map-theme-filter');
    themes.forEach(t => {
      themeSelect.innerHTML += `<option value="${t.id}">${t.name}</option>`;
    });

    const allOrgsList = await soth.data.organizations();
    const partnerOrgsList = allOrgsList.filter(o => o.org_type !== 'observer');
    const orgSelect = document.getElementById('map-org-filter');
    partnerOrgsList.forEach(o => {
      orgSelect.innerHTML += `<option value="${o.id}">${o.name}</option>`;
    });

    const stateSelect = document.getElementById('map-state-filter');
    window.SOTH_LGD.states.forEach(s => {
      stateSelect.innerHTML += `<option value="${s.name}">${s.name}</option>`;
    });

    await soth.renderMap();
    await soth.renderStats();
    await soth.renderMaturityCharts();
  } catch (e) {
    console.error('SoTH: initPage error:', e);
    document.getElementById('stats-ribbon').innerHTML =
      '<div class="stat-card"><div class="stat-value">Error</div><div class="stat-label">' + (e.message || 'Unknown') + '</div></div>';
  }
})();
</script>
</body>
</html>
