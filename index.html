<head>

<title>Sense of The House (SoTH)</title>
<link rel="stylesheet" href="styles/app.css?v=20260727a">

<script src="app/core.js?v=20260727a"></script>

<body>
<div id="toast-container"></div>

<header class="app-header">
  <div class="brand">Sense of <span>The House</span></div>
    <nav>
    <a href="index.html">Map</a>
    <a href="dashboard.html" id="nav-dashboard" style="display:none">Dashboard</a>
    <a href="superset.html">Superset</a>
    <a href="compare.html">Compare</a>
    <a href="admin.html" id="nav-admin" style="display:none">Admin</a>
    <span id="user-label" style="display:none;font-size:12px;color:var(--gray-500);"></span>
    <a href="login.html" id="nav-login">Login</a>
    <button id="nav-logout" style="display:none" onclick="soth.auth.signOut(); window.location='index.html'">Logout</button>
  </nav>

<main class="app-content">
  <div class="card" style="margin-bottom:20px;">
    <div class="card-header">
      <span>India - Partner & Parameter Coverage Map</span>
      <span style="display:flex;gap:8px;font-size:12px;font-weight:400;">
        <select id="map-theme-filter" onchange="soth.renderMap()">
          <option value="">All Themes</option>
        </select>
        <select id="map-org-filter" onchange="soth.renderMap()">
          <option value="">All Partners</option>
        </select>
        <select id="map-state-filter" onchange="soth.renderMap()">
          <option value="">All States</option>
        </select>
      </span>

    <div id="map" class="map-container" style="height:600px;"></div>

      <span>Partner Maturity Overview</span>
      <span id="maturity-count" style="font-size:13px;font-weight:400;color:var(--gray-500);"></span>

    <div id="maturity-charts" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;"></div>

<!-- Village Detail Side Panel -->

    <h3 id="panel-village-name">Village</h3>
    <button class="btn btn-outline btn-small" onclick="soth.closeVillagePanel()" aria-label="Close">✕</button>
  </div>
  <div id="panel-content" class="panel-content"></div>
</aside>

<!-- Partner Detail Side Panel -->
<aside id="partner-detail-panel" class="village-detail-panel hidden" role="dialog" aria-modal="true" aria-label="Partner details">
  <div class="panel-header">
    <h3 id="partner-panel-title">Partner</h3>
    <button class="btn btn-outline btn-small" onclick="soth.closePartnerPanel()" aria-label="Close">✕</button>
  </div>
  <div id="partner-panel-content" class="panel-content"></div>
</aside>

<!-- History Modal -->
<div id="history-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <div id="history-body"></div>
    <div class="form-actions"><button class="btn btn-outline" onclick="document.getElementById('history-modal').classList.add('hidden')">Close</button></div>
  </div>
</div>

<!-- Propose Modal -->
<div id="propose-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>Propose New Sub-Parameter for <span id="propose-theme-name"></span></h3>
    <form id="propose-form">
      <input type="hidden" id="propose-theme-id">
      <label>Parameter Name *<input type="text" id="propose-name" required></label>
      <label>Description<textarea id="propose-desc" rows="2"></textarea></label>
      <label>Data Type<select id="propose-data-type">
        <option value="qualitative">Qualitative (Yes/No/Partial)</option>
        <option value="quantitative_scale">Quantitative (Scale)</option>
        <option value="quantitative_numeric">Quantitative (Number)</option>
        <option value="text">Text / Notes</option>
      </select></label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Submit for Review</button>
        <button type="button" class="btn btn-outline" onclick="document.getElementById('propose-modal').classList.add('hidden')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
soth.renderMap = async function () {
  const themeFilter = document.getElementById('map-theme-filter')?.value || '';
  const orgFilter = document.getElementById('map-org-filter')?.value || '';
  const stateFilter = document.getElementById('map-state-filter')?.value || '';

  const map = await soth.map.createMap('map');
  if (!map) return;

  soth.map.clearMarkers();

  // Wait for boundary polygons to load BEFORE adding markers (pins render on top)
  if (soth.map._boundariesPromise) await soth.map._boundariesPromise;

  // Load all orgs + pre-compute their maturities in parallel
  const orgs = await soth.data.organizations();
  const filteredOrgs = orgFilter ? orgs.filter(o => o.id === orgFilter) : orgs;
  const maturities = await Promise.all(filteredOrgs.map(o => soth.maturity.compute(o.id)));
  const maturityByOrg = {};
  filteredOrgs.forEach((o, i) => { maturityByOrg[o.id] = maturities[i]; });

  // Build per-coordinate cluster: key = "lat,lng" -> { villages:[], orgs:[] }
  const coordMap = {};
  for (const org of filteredOrgs) {
    const villages = await soth.data.orgVillages(org.id);
    const maturity = maturityByOrg[org.id];
    for (const ov of villages) {
      const v = ov.villages;
      if (!v || !v.lat || !v.lng) continue;
      if (stateFilter && v.state !== stateFilter) continue;
      if (themeFilter) {
        const caps = await soth.data.latestCaptures(org.id, v.id);
        const hasTheme = caps.some(c => c.sub_parameters?.theme_id === themeFilter);
        if (!hasTheme) continue;
      }
      const key = `${v.lat},${v.lng}`;
      if (!coordMap[key]) {
        coordMap[key] = { lat: v.lat, lng: v.lng, villages: [], orgsSet: {} };
      }
      const cluster = coordMap[key];
      // Deduplicate villages by id (same village can appear under multiple orgs)
      if (!cluster.villages.find(x => x.id === v.id)) {
        cluster.villages.push({ id: v.id, name: v.name, district: v.district, state: v.state });
      }
      // Deduplicate orgs by id
      if (!cluster.orgsSet[org.id]) {
        cluster.orgsSet[org.id] = {
          id: org.id, name: org.name,
          maturity: Math.round(maturity.overall),
          color: maturity.overall ? soth.map.maturityColor(maturity.overall) : '#94a3b8',
        };
      }
    }
  }

  // Render one pin per unique coordinate
  for (const key in coordMap) {
    const cluster = coordMap[key];
    const orgsList = Object.values(cluster.orgsSet);
    const bestOrg = orgsList.sort((a, b) => b.maturity - a.maturity)[0];
    soth.map.addVillagePin({
      lat: cluster.lat,
      lng: cluster.lng,
      villages: cluster.villages,
      allOrgs: orgsList,
      color: bestOrg?.color || '#94a3b8',
      maturity: bestOrg?.maturity || 0,
    });
  }
};

soth.renderStats = async function () {
  const orgs = await soth.data.organizations();
  const allParams = await soth.data.allSubParams();
  const { data: allVillages } = await soth.sb().from('villages').select('*').limit(1);
  const { count: vCount } = await soth.sb().from('villages').select('*', { count: 'exact', head: true });

  const ribbon = document.getElementById('stats-ribbon');
  ribbon.innerHTML = `
    <div class="stat-card"><div class="stat-value">${orgs.length}</div><div class="stat-label">Partner Organisations</div></div>
    <div class="stat-card"><div class="stat-value">${allParams.length}</div><div class="stat-label">Sub-Parameters (Superset)</div></div>
      <div class="stat-card"><div class="stat-value">${vCount || 0}</div><div class="stat-label">Villages</div></div>
    <div class="stat-card"><div class="stat-value">${new Set(allParams.map(p => p.theme_id)).size}</div><div class="stat-label">Thematic Areas</div></div>
  `;
};

soth.renderMaturityCharts = async function () {
  const card = document.getElementById('maturity-card');
  const user = soth.currentUser;
  const profile = soth.currentProfile;
  if (!user || !profile) { card.style.display = 'none'; return; }
  card.style.display = '';

  try {
    const orgs = await soth.data.organizations();
    const container = document.getElementById('maturity-charts');
    const countLabel = document.getElementById('maturity-count');

    // Admin sees all orgs, partner sees only their org
    const orgsToShow = profile.role === 'soth_admin'
      ? orgs
      : orgs.filter(o => o.id === profile.org_id);

    let totalScores = 0;
    let scored = 0;
    const cards = [];
    // Pre-fetch village counts for all orgs in parallel
    const orgVillageCounts = {};
    await Promise.all(orgsToShow.map(async (org) => {
      const villages = await soth.data.orgVillages(org.id);
      orgVillageCounts[org.id] = villages.length;
    }));
    for (const org of orgsToShow) {
      const m = await soth.maturity.compute(org.id);
      totalScores += m.overall || 0;
      if (m.overall) scored++;
      const color = soth.map.maturityColor(m.overall);
      const vCount = orgVillageCounts[org.id] || 0;
      cards.push(`<div class="card" style="padding:16px;cursor:pointer;transition:box-shadow 0.15s;" onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,0.1)'" onmouseout="this.style.boxShadow='none'" onclick="soth.openPartnerDashboard('${org.id}','${soth.ui.escapeHtml(org.name)}')">
        <div style="font-weight:600;font-size:14px;margin-bottom:4px;">${soth.ui.escapeHtml(org.name)}</div>
        <div style="font-size:11px;color:var(--gray-400);margin-bottom:8px;">${vCount} village${vCount !== 1 ? 's' : ''}</div>
        <div style="font-size:28px;font-weight:700;color:${color};">${m.overall}%</div>
        <div class="maturity-bar"><div class="maturity-fill" style="width:${m.overall}%;background:${color};"></div></div>
        <div style="font-size:12px;color:var(--gray-500);margin-top:8px;">
          ${m.overall ? m.themes.filter(t => t.score > 0).length + '/' + m.themes.length + ' themes active' : 'No capture data yet'}
        </div>
      </div>`);
    }
    container.innerHTML = cards.join('');
    countLabel.textContent = scored ? `Average: ${orgsToShow.length ? Math.round(totalScores / orgsToShow.length) : 0}%` : 'No capture data yet';
  } catch (e) {
    console.error('SoTH: renderMaturityCharts error:', e);
  }
};

// Village Detail Panel
soth.openVillageInPanel = async function (orgId, villageId, villageName) {
  const panel = document.getElementById('village-detail-panel');
  const content = document.getElementById('panel-content');
  const title = document.getElementById('panel-village-name');
  if (!panel || !content || !title) return;

  title.textContent = villageName;
  content.innerHTML = '<div class="loading-spinner">Loading village data...</div>';
  panel.classList.remove('hidden');

  // Require login; RLS will protect unauthorized writes
  if (!soth.currentUser || !soth.currentProfile) {
    content.innerHTML = '<p class="empty-state">Please <a href="login.html">log in</a> to view and edit village details.</p>';
    return;
  }

  try {
    // Non-admins can only open their own org's villages
    if (soth.currentProfile.role !== 'soth_admin' && soth.currentProfile.org_id !== orgId) {
      content.innerHTML = '<p class="empty-state">You do not have access to this village.</p>';
      return;
    }
    await soth.capture.renderTieredWorkspace('panel-content', { orgId, villageId });
  } catch (e) {
    console.error('openVillageInPanel error:', e);
    content.innerHTML = '<p class="empty-state">Failed to load village data.</p>';
  }
};

soth.closeVillagePanel = function () {
  const panel = document.getElementById('village-detail-panel');
  if (panel) panel.classList.add('hidden');
};

// Partner Dashboard — opened by clicking a maturity card
soth._partnerCharts = {};
soth.openPartnerDashboard = async function (orgId, orgName) {
  const panel = document.getElementById('partner-detail-panel');
  const content = document.getElementById('partner-panel-content');
  const title = document.getElementById('partner-panel-title');
  if (!panel || !content || !title) return;
  title.textContent = orgName;
  content.innerHTML = '<div class="loading-spinner">Loading partner data...</div>';
  panel.classList.remove('hidden');

  if (!soth.currentUser || !soth.currentProfile) {
    content.innerHTML = '<p class="empty-state">Please <a href="login.html">log in</a> to view partner details.</p>';
    return;
  }
  if (soth.currentProfile.role !== 'soth_admin' && soth.currentProfile.org_id !== orgId) {
    content.innerHTML = '<p class="empty-state">You do not have access to this partner.</p>';
    return;
  }

  try {
    // 1. Fetch all data in parallel
    const [orgVillages, maturity, themes, allSubParams] = await Promise.all([
      soth.data.orgVillages(orgId),
      soth.maturity.compute(orgId),
      soth.data.themes(),
      soth.data.allSubParams(),
    ]);

    // 2. Compute stats
    const allVillages = orgVillages.map(ov => ov.villages).filter(Boolean);
    const statesSet = new Set(allVillages.map(v => v.state).filter(Boolean));
    const uniqueStates = [...statesSet].sort();

    // For each village, check if it has captures
    const capMap = {};
    const caps = await soth.sb().from('latest_captures').select('village_id').eq('org_id', orgId);
    (caps?.data || []).forEach(c => { capMap[c.village_id] = true; });
    const withData = allVillages.filter(v => capMap[v.id]).length;
    const withoutData = allVillages.length - withData;

    // 3. Build paramsByTheme
    const paramsByTheme = {};
    allSubParams.forEach(p => {
      if (!paramsByTheme[p.theme_id]) paramsByTheme[p.theme_id] = [];
      paramsByTheme[p.theme_id].push(p);
    });

    // 4. Fetch captures for all villages to build per-village per-param data
    const allCaps = await soth.sb().from('latest_captures').select('*').eq('org_id', orgId);
    const capByVillage = {};
    (allCaps?.data || []).forEach(c => {
      if (!capByVillage[c.village_id]) capByVillage[c.village_id] = {};
      capByVillage[c.village_id][c.sub_parameter_id] = c;
    });

    // 5. Render HTML
    let html = '';

    // Summary stats
    html += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">
      <div class="stat-card"><div class="stat-value">${allVillages.length}</div><div class="stat-label">Villages</div></div>
      <div class="stat-card"><div class="stat-value">${uniqueStates.length}</div><div class="stat-label">States</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--success);">${withData}</div><div class="stat-label">With Data</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--danger);">${withoutData}</div><div class="stat-label">Without Data</div></div>
    </div>`;

    // Spider chart
    const radarId = 'partner-radar-' + orgId;
    html += `<div style="margin-bottom:20px;"><div style="font-weight:600;margin-bottom:8px;">Theme Scores</div>
      <div style="height:300px;"><canvas id="${radarId}"></canvas></div></div>`;

    // Filters
    html += `<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <select id="partner-state-filter" onchange="soth.filterPartnerVillages('${orgId}')" style="flex:1;min-width:150px;">
        <option value="">All States</option>
        ${uniqueStates.map(s => `<option value="${soth.ui.escapeHtml(s)}">${soth.ui.escapeHtml(s)}</option>`).join('')}
      </select>
      <input type="text" id="partner-village-search" placeholder="Search villages..." style="flex:1;min-width:150px;" oninput="soth.filterPartnerVillages('${orgId}')">
    </div>`;

    // Parameter table (themes)
    html += `<div style="font-weight:600;margin-bottom:8px;">Parameters by Theme</div>`;
    html += `<table class="param-table" id="partner-theme-table"><thead><tr><th>Theme</th><th>Score</th><th>Captured</th><th></th></tr></thead><tbody>`;
    themes.forEach(t => {
      const themeScore = maturity.themes.find(mt => mt.id === t.id);
      const score = themeScore?.score || 0;
      const captured = themeScore?.capturedParams || 0;
      const total = (paramsByTheme[t.id] || []).length;
      const color = soth.map.maturityColor(score);
      html += `<tr class="theme-row" data-theme-id="${t.id}" style="cursor:pointer;" onclick="soth.togglePartnerTheme('${t.id}','${orgId}')">
        <td><strong>${soth.ui.escapeHtml(t.name)}</strong></td>
        <td><span style="background:${color};color:white;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;">${score}%</span></td>
        <td>${captured}/${total}</td>
        <td><span class="expand-icon">▸</span></td>
      </tr>`;
    });
    html += '</tbody></table>';

    // Sub-parameter detail panels (hidden by default, one per theme)
    themes.forEach(t => {
      const params = paramsByTheme[t.id] || [];
      html += `<div class="partner-subparam-panel hidden" id="partner-subparam-${t.id}" style="margin-top:8px;margin-bottom:16px;">
        <table class="param-table"><thead><tr><th>Sub-Parameter</th><th>Type</th><th>Qualitative</th><th>Quantitative</th><th>Villages</th><th></th></tr></thead><tbody>`;
      params.forEach(p => {
        // Count how many villages have this param captured
        let capturedCount = 0;
        let qualVal = '', quantVal = '';
        for (const vid in capByVillage) {
          if (capByVillage[vid][p.id]) {
            capturedCount++;
            if (!qualVal && capByVillage[vid][p.id].value_text) qualVal = capByVillage[vid][p.id].value_text;
            if (!quantVal && capByVillage[vid][p.id].value_scale != null) quantVal = capByVillage[vid][p.id].value_scale;
          }
        }
        html += `<tr>
          <td><strong>${soth.ui.escapeHtml(p.name)}</strong></td>
          <td>${soth.ui.dataTypeLabel(p.data_type)}</td>
          <td>${qualVal || '—'}</td>
          <td>${quantVal != null ? quantVal + '%' : '—'}</td>
          <td>${capturedCount}/${allVillages.length}</td>
          <td></td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    });

    // Village list
    html += `<div style="font-weight:600;margin-top:20px;margin-bottom:8px;">Villages (${allVillages.length})</div>`;
    html += `<div id="partner-village-list" style="max-height:400px;overflow-y:auto;">`;
    html += `<table class="param-table"><thead><tr><th>Village</th><th>District</th><th>State</th><th>Data</th><th></th></tr></thead><tbody>`;
    allVillages.sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach(v => {
      const hasData = capMap[v.id];
      html += `<tr class="partner-village-row" data-state="${soth.ui.escapeHtml(v.state || '')}">
        <td><strong>${soth.ui.escapeHtml(v.name)}</strong></td>
        <td>${soth.ui.escapeHtml(v.district || '')}</td>
        <td>${soth.ui.escapeHtml(v.state || '')}</td>
        <td>${hasData ? '<span style="color:var(--success);">✓</span>' : '<span style="color:var(--danger);">✗</span>'}</td>
        <td><button class="btn btn-small btn-outline" onclick="soth.openVillageInPanel('${orgId}','${v.id}','${soth.ui.escapeAttr(v.name)}')">Edit</button></td>
      </tr>`;
    });
    html += '</tbody></table></div>';

    content.innerHTML = html;

    // 6. Build radar chart
    if (maturity.themes.length) {
      if (soth._partnerCharts[radarId]) soth._partnerCharts[radarId].destroy();
      soth._partnerCharts[radarId] = new Chart(document.getElementById(radarId), {
        type: 'radar',
        data: {
          labels: maturity.themes.map(t => t.name),
          datasets: [{
            label: 'Theme Score',
            data: maturity.themes.map(t => t.score),
            backgroundColor: 'rgba(37,99,235,0.1)',
            borderColor: '#2563eb',
            pointBackgroundColor: maturity.themes.map(t => soth.map.maturityColor(t.score)),
            pointRadius: 5,
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { r: { min: 0, max: 100, ticks: { stepSize: 20 } } },
          plugins: { legend: { display: false } }
        }
      });
    }
  } catch (e) {
    console.error('openPartnerDashboard error:', e);
    content.innerHTML = '<p class="empty-state">Failed to load partner data.</p>';
  }
};

soth.togglePartnerTheme = function (themeId, orgId) {
  const panel = document.getElementById(`partner-subparam-${themeId}`);
  const row = document.querySelector(`#partner-theme-table .theme-row[data-theme-id="${themeId}"]`);
  const icon = row?.querySelector('.expand-icon');
  if (!panel) return;
  const isOpen = !panel.classList.contains('hidden');
  if (isOpen) {
    panel.classList.add('hidden');
    if (icon) icon.textContent = '▸';
  } else {
    document.querySelectorAll('.partner-subparam-panel').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('#partner-theme-table .expand-icon').forEach(i => i.textContent = '▸');
    panel.classList.remove('hidden');
    if (icon) icon.textContent = '▾';
  }
};

soth.filterPartnerVillages = function (orgId) {
  const stateFilter = document.getElementById('partner-state-filter')?.value || '';
  const search = (document.getElementById('partner-village-search')?.value || '').toLowerCase().trim();
  document.querySelectorAll('.partner-village-row').forEach(row => {
    const state = row.dataset.state || '';
    const name = row.querySelector('td')?.textContent?.toLowerCase() || '';
    const matchState = !stateFilter || state === stateFilter;
    const matchSearch = !search || name.includes(search);
    row.style.display = (matchState && matchSearch) ? '' : 'none';
  });
};

soth.closePartnerPanel = function () {
  const panel = document.getElementById('partner-detail-panel');
  if (panel) panel.classList.add('hidden');
};

// Wire propose form
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('propose-form')?.addEventListener('submit', function (e) {
    e.preventDefault();
    soth.capture.submitProposal();
  });
});

// Populate filters
(async function initPage() {
  try {
    await soth.auth.init();

  if (soth.currentUser) {
    document.getElementById('nav-dashboard').style.display = '';
    document.getElementById('nav-login').style.display = 'none';
    document.getElementById('nav-logout').style.display = '';
    document.getElementById('user-label').textContent = soth.currentUser.email;
    document.getElementById('user-label').style.display = '';
    if (soth.currentProfile?.role === 'soth_admin') {
      document.getElementById('nav-admin').style.display = '';
    }
  }

    const themes = await soth.data.themes();
    const themeSelect = document.getElementById('map-theme-filter');
    themes.forEach(t => {
      themeSelect.innerHTML += `<option value="${t.id}">${t.name}</option>`;
    });

    const orgs = await soth.data.organizations();
    const orgSelect = document.getElementById('map-org-filter');
    orgs.forEach(o => {
      orgSelect.innerHTML += `<option value="${o.id}">${o.name}</option>`;
    });

    const stateSelect = document.getElementById('map-state-filter');
    window.SOTH_LGD.states.forEach(s => {
      stateSelect.innerHTML += `<option value="${s.name}">${s.name}</option>`;
    });

    await soth.renderMap();
    await soth.renderStats();
    await soth.renderMaturityCharts();
  } catch (e) {
    console.error('SoTH: initPage error:', e);
    document.getElementById('stats-ribbon').innerHTML =
      '<div class="stat-card"><div class="stat-value">Error</div><div class="stat-label">' + (e.message || 'Unknown') + '</div></div>';
  }
})();
</script>
</body>
</html>
