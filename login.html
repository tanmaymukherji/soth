<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SoTH</title>
<link rel="stylesheet" href="styles/app.css?v=20260727b">
<script src="config.js?v=20260727b"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  onload="window.dispatchEvent(new Event('supabaseReady'))"></script>
<script src="data/lgd.js?v=20260727b"></script>
<script src="app/core.js?v=20260727b"></script>
</head>
<body>
<div id="toast-container"></div>

<header class="app-header">
  <div class="brand">Sense of <span>The House</span></div>
  <nav><a href="index.html">Back to Map</a></nav>
</header>

<main class="auth-container">
  <div class="auth-card" id="auth-card">
    <!-- Step 1: Email + Password -->
    <div id="step-credentials">
      <h2 id="auth-title">Sign In</h2>
      <div class="field-group">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="field-group" id="password-group">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="Enter password" autocomplete="current-password">
      </div>
      <div class="field-group" id="name-group" style="display:none;">
        <label for="auth-name">Full Name</label>
        <input type="text" id="auth-name" placeholder="Your name" autocomplete="name">
      </div>
      <button class="btn btn-primary" style="width:100%;" id="auth-action-btn">Sign In</button>
      <div class="form-footer" id="auth-footer">
        <a href="#" id="auth-toggle" onclick="toggleMode()">Create an account</a>
        <span style="margin:0 8px">.</span>
        <a href="#" onclick="forgotPassword()">Forgot password?</a>
      </div>
    </div>

    <!-- Step 2: OTP Verification -->
    <div id="step-otp" style="display:none;">
      <h2>Verify Email</h2>
      <p style="font-size:13px;color:var(--gray-500);margin-bottom:16px;">
        We sent a 6-digit code to <strong id="otp-email-display"></strong>.<br>
        Check your inbox (and spam folder). Enter the code below.
      </p>
      <div class="field-group">
        <label for="otp-token">Verification Code</label>
        <input type="text" id="otp-token" placeholder="000000" maxlength="6" autocomplete="one-time-code"
          style="text-align:center;font-size:24px;letter-spacing:8px;font-weight:700;">
      </div>
      <button class="btn btn-primary" style="width:100%;" id="otp-verify-btn">Verify & Sign In</button>
      <div class="form-footer">
        <a href="#" onclick="backToLogin()">Back to Sign In</a>
        <span style="margin:0 8px">.</span>
        <a href="#" id="otp-resend" onclick="resendOtp()">Resend Code</a>
      </div>
    </div>
  </div>
</main>

<script>
let mode = 'login';
let otpEmail = '';
let otpPassword = '';
let otpFullName = '';

function toggleMode() {
  mode = mode === 'login' ? 'signup' : 'login';
  document.getElementById('auth-title').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
  document.getElementById('auth-action-btn').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
  document.getElementById('name-group').style.display = mode === 'signup' ? 'block' : 'none';
  document.getElementById('auth-toggle').textContent = mode === 'login' ? 'Create an account' : 'Already have an account? Sign in';
  document.getElementById('auth-footer').querySelector('a:last-child').style.display = mode === 'login' ? '' : 'none';
}

function showOtpStep() {
  document.getElementById('step-credentials').style.display = 'none';
  document.getElementById('step-otp').style.display = '';
  document.getElementById('otp-email-display').textContent = otpEmail;
  document.getElementById('otp-token').value = '';
  document.getElementById('otp-token').focus();
}

function backToLogin() {
  document.getElementById('step-credentials').style.display = '';
  document.getElementById('step-otp').style.display = 'none';
}

async function resendOtp() {
  const { error } = await soth.auth.sendOtp(otpEmail);
  if (error) {
    soth.ui.showToast(error.message, 'error');
  } else {
    soth.ui.showToast('New code sent!', 'success');
  }
}

// Sign In / Sign Up
document.getElementById('auth-action-btn').addEventListener('click', async function () {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const name = document.getElementById('auth-name').value.trim();

  if (!email || !password) {
    soth.ui.showToast('Email and password are required', 'error');
    return;
  }

  if (mode === 'login') {
    const { error } = await soth.auth.signIn(email, password);
    if (error) {
      soth.ui.showToast(error.message, 'error');
    } else {
      const redirect = new URLSearchParams(window.location.search).get('redirect') || '';
      const isAdmin = soth.currentProfile?.role === 'soth_admin';
      if (redirect) window.location.href = redirect;
      else if (isAdmin) window.location.href = 'admin.html';
      else window.location.href = 'dashboard.html';
    }
  } else {
    if (password.length < 6) {
      soth.ui.showToast('Password must be at least 6 characters', 'error');
      return;
    }
    otpEmail = email;
    otpPassword = password;
    otpFullName = name;
    // Create account first
    const { error: signUpError } = await soth.auth.signUp(email, password, name);
    if (signUpError && !signUpError.message?.includes('already registered')) {
      soth.ui.showToast(signUpError.message, 'error');
      return;
    }
    // Send OTP via signInWithOtp (independent of signup confirmation)
    const { error: otpError } = await soth.auth.sendOtp(email);
    if (otpError) {
      soth.ui.showToast(otpError.message, 'error');
    } else {
      showOtpStep();
      soth.ui.showToast('Code sent to your email!', 'success');
    }
  }
});

// OTP Verify
document.getElementById('otp-verify-btn').addEventListener('click', async function () {
  const token = document.getElementById('otp-token').value.trim();
  if (!token || token.length !== 6) {
    soth.ui.showToast('Enter the 6-digit code', 'error');
    return;
  }
  const { data, error } = await soth.auth.verifyOtp(otpEmail, token);
  if (error) {
    soth.ui.showToast(error.message, 'error');
  } else {
    soth.ui.showToast('Verified! Signing in...', 'success');
    const redirect = new URLSearchParams(window.location.search).get('redirect') || '';
    const isAdmin = soth.currentProfile?.role === 'soth_admin';
    if (redirect) window.location.href = redirect;
    else if (isAdmin) window.location.href = 'admin.html';
    else window.location.href = 'dashboard.html';
  }
});

// Allow Enter key on OTP input
document.getElementById('otp-token').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('otp-verify-btn').click();
});

async function forgotPassword() {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) {
    soth.ui.showToast('Enter your email first', 'error');
    return;
  }
  const { error } = await soth.auth.sendPasswordReset(email);
  if (error) {
    soth.ui.showToast(error.message, 'error');
  } else {
    soth.ui.showToast('Password reset email sent!', 'success');
  }
}

// Handle email confirmation redirect + password recovery
(async function () {
  await soth.auth.init();

  const hash = window.location.hash;
  const params = new URLSearchParams(window.location.search);

  // Handle email confirmation link (signup verification)
  // Link format: login.html#access_token=...&token_type=bearer&type=signup
  if (hash && hash.includes('type=signup')) {
    try {
      const hashParams = new URLSearchParams(hash.substring(1));
      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');

      if (accessToken && refreshToken) {
        const sb = soth.sb();
        const { data, error } = await sb.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (!error && data?.session) {
          soth.currentUser = data.session.user;
          await soth.auth.loadProfile();
          soth.ui.showToast('Email verified! Signing in...', 'success');
          window.history.replaceState({}, '', window.location.pathname);
          const redirect = params.get('redirect') || '';
          const isAdmin = soth.currentProfile?.role === 'soth_admin';
          if (redirect) window.location.href = redirect;
          else if (isAdmin) window.location.href = 'admin.html';
          else window.location.href = 'dashboard.html';
          return;
        }
      }
    } catch (e) {
      console.error('Confirmation link error:', e);
    }
    soth.ui.showToast('Verification failed. Please try signing in.', 'error');
    window.history.replaceState({}, '', window.location.pathname);
  }

  // Handle password recovery link
  if (hash && hash.includes('type=recovery')) {
    const newPw = prompt('Enter your new password (6+ characters):');
    if (newPw && newPw.length >= 6) {
      const { error } = await soth.auth.updatePassword(newPw);
      if (error) {
        soth.ui.showToast(error.message, 'error');
      } else {
        soth.ui.showToast('Password updated! You can now sign in.', 'success');
      }
    }
    window.history.replaceState({}, '', window.location.pathname);
  }

  if (soth.currentUser) {
    window.location.href = 'dashboard.html';
  }
})();
</script>
</body>
</html>
